data:
  source_url: https://huggingface.co/datasets/PrimeQA/clapnq/resolve/b7f27c581c2cbe6e6affa121bb4194ae08fc6133/clapnq_dev_answerable.jsonl
  source_sha256: 3eefef4a3d4e34c0f7d2c2eceb9bde263bf43ee8edac1b4fe8d74f8b6a0bdfbe
  raw_path: data/raw/clapnq_dev_answerable.jsonl
  normalized_path: data/processed/clapnq_dev_answerable.jsonl
  answerable_only: true
  max_samples: null

run:
  name: main
  output_dir: runs
  seed: 20260819

models:
  qwen2.5-7b:
    served_model: qwen2.5-7b
  llama3.1-8b:
    served_model: llama3.1-8b
  mistral-7b:
    served_model: mistral-7b

generation:
  base_url: http://127.0.0.1:8000/v1
  api_key: EMPTY
  conditions: [gold, closed_book]
  temperature: 0.0
  top_p: 1.0
  top_k: 0
  min_p: 0.0
  presence_penalty: 0.0
  repetition_penalty: 1.0
  max_tokens: 256
  concurrency: 16
  request_timeout_seconds: 180
  max_retries: 5
  retry_base_seconds: 1.0

judge:
  base_url: http://127.0.0.1:18000/v1
  api_key: EMPTY
  served_model: qwen3.8-27b-judge
  enable_thinking: false
  deterministic_inference: true

  # Custom structured-judge profile: official non-thinking sampling
  # except presence_penalty. Official chat non-thinking uses 1.5; this
  # Judge uses 0.0 because the schema emits a classification label.
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  min_p: 0.0
  presence_penalty: 0.0
  repetition_penalty: 1.0

  max_tokens: 256
  concurrency: 5
  request_timeout_seconds: 180
  max_retries: 5
  retry_base_seconds: 1.0

metrics:
  bootstrap_samples: 10000
  confidence_level: 0.95
  allow_rouge_fallback: false
  bertscore: false
  bertscore_model: roberta-large

