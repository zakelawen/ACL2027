[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clapnq-eval"
version = "0.1.0"
description = "Full-Gold versus closed-book evaluation on CLAPnq"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "numpy>=2.0",
  "openai>=2.6,<4",
  "pydantic>=2.10,<3",
  "PyYAML>=6.0",
  "rouge-score>=0.1.2",
  "scipy>=1.10",
  "tqdm>=4.66",
]

[project.optional-dependencies]
semantic = ["bert-score>=0.3.13"]

[project.scripts]
clapnq-eval = "clapnq_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

